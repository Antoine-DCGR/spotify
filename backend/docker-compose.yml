version: '3.8'

services:
  php:
    build: .
    ports:
      - "8000:80"
    volumes:
      - ./public/.htaccess:/var/www/html/.htaccess
      - ./public/index.php:/var/www/html/index.php
      - ./public/setup.php:/var/www/html/setup.php
      - ./cache:/var/www/html/cache
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config

    command: >
      bash -c "
        mkdir -p cache &&
        chown -R www-data:www-data cache &&
        chmod -R 775 cache &&
        apache2-foreground
      "

    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - CLIENT_SPOTIFY_ID=${CLIENT_SPOTIFY_ID}
      - CLIENT_SPOTIFY_SECRET=${CLIENT_SPOTIFY_SECRET}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - RAPID_API_HOST=${RAPID_API_HOST}
      - RAPID_API_KEY=${RAPID_API_KEY}
      - APP_URL=${APP_URL}
      - JWT_SECRET=${JWT_SECRET}
      

    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
